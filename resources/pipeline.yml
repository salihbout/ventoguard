resources:
  pipelines:
    ventoguard_medallion:
      name: ventoguard-medallion
      catalog: ${var.catalog}
      # default publishing schema = bronze; silver/gold datasets use fully-qualified names from the configuration below
      schema: ${var.bronze_schema}
      serverless: true
      channel: CURRENT
      photon: true
      continuous: false
      libraries:
        - glob:
            include: ../src/pipeline/**
      configuration:
        catalog: ${var.catalog}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}
        landing_root: /Volumes/${var.catalog}/${var.bronze_schema}/raw_landing
