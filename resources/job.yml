resources:
  jobs:
    ventoguard_end_to_end:
      name: ventoguard-end-to-end
      description: "Raw landing -> Lakeflow medallion -> UC governance -> ML failure model -> GenAI briefs -> Lakebase serving"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: generate_raw_data
          notebook_task:
            notebook_path: ../src/notebooks/00_generate_raw_data.py
        - task_key: lakeflow_medallion
          depends_on: [{task_key: generate_raw_data}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.ventoguard_medallion.id}
        - task_key: train_failure_model
          depends_on: [{task_key: lakeflow_medallion}]
          notebook_task:
            notebook_path: ../src/notebooks/02_train_failure_model.py
        - task_key: score_and_genai_briefs
          depends_on: [{task_key: train_failure_model}]
          notebook_task:
            notebook_path: ../src/notebooks/03_score_and_genai.py
            base_parameters:
              llm_endpoint: ${var.llm_endpoint}
              llm_endpoint_fast: ${var.llm_endpoint_fast}
        - task_key: uc_governance
          depends_on: [{task_key: score_and_genai_briefs}]
          notebook_task:
            notebook_path: ../src/notebooks/04_uc_governance.py
        - task_key: refresh_lakebase
          depends_on: [{task_key: score_and_genai_briefs}]
          notebook_task:
            notebook_path: ../src/notebooks/05_refresh_lakebase.py
          max_retries: 1
          min_retry_interval_millis: 60000
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: Europe/Berlin
        pause_status: PAUSED
